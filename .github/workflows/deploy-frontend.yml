name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-frontend.yml"
      - ".dockerignore"
      - "apps/frontend/**"
      - "infra/docker/frontend.Dockerfile"
      - "infra/docker-compose.yml"
      - "infra/scripts/deploy-frontend.sh"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Frontend Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL || secrets.NEXT_PUBLIC_BACKEND_URL || '' }}
      NEXT_PUBLIC_SHIPPING_GST_RATE: ${{ vars.NEXT_PUBLIC_SHIPPING_GST_RATE || secrets.NEXT_PUBLIC_SHIPPING_GST_RATE || '' }}
      NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE: ${{ vars.NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE || secrets.NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm -C apps/frontend run build

  build-and-push:
    name: Build And Push Frontend Image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}/frontend" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || secrets.NEXT_PUBLIC_BACKEND_URL || '' }}
            NEXT_PUBLIC_SHIPPING_GST_RATE=${{ vars.NEXT_PUBLIC_SHIPPING_GST_RATE || secrets.NEXT_PUBLIC_SHIPPING_GST_RATE || '' }}
            NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE=${{ vars.NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE || secrets.NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE || '' }}
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script_stop: true
          script: |
            export APP_DIR="${{ secrets.VPS_APP_DIR }}"
            export BRANCH="main"
            export GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export FRONTEND_IMAGE="ghcr.io/${{ github.repository }}/frontend"
            export FRONTEND_IMAGE="$(echo "$FRONTEND_IMAGE" | tr '[:upper:]' '[:lower:]')"
            export FRONTEND_TAG="${{ github.sha }}"
            export FRONTEND_TAG="${FRONTEND_TAG:0:12}"
            export FRONTEND_BACKEND_URL="${{ vars.FRONTEND_BACKEND_URL || 'http://backend:5050' }}"
            export NEXT_PUBLIC_BACKEND_URL="${{ vars.NEXT_PUBLIC_BACKEND_URL || secrets.NEXT_PUBLIC_BACKEND_URL || '' }}"
            export NEXT_PUBLIC_SHIPPING_GST_RATE="${{ vars.NEXT_PUBLIC_SHIPPING_GST_RATE || secrets.NEXT_PUBLIC_SHIPPING_GST_RATE || '' }}"
            export NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE="${{ vars.NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE || secrets.NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE || '' }}"
            bash "${APP_DIR}/infra/scripts/deploy-frontend.sh"
