version: "3.9"

services:
  nginx:
    image: nginx:stable
    container_name: pureastra_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    restart: always

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
    container_name: pureastra_frontend
    environment:
      - NODE_ENV=production
    restart: always

  backend:
    build:
      context: ../apps/backend
      dockerfile: ../../infra/docker/backend.Dockerfile
    container_name: pureastra_backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pureastra
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15
    container_name: pureastra_postgres
    environment:
      POSTGRES_DB: pureastra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: pureastra_redis
    restart: always

volumes:
  postgres_data:
