services:
  redis:
    image: redis:7-alpine
    container_name: pureastra_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/helloaethonex-cmd/pureastra/backend}:${BACKEND_TAG:-main}
    container_name: pureastra_backend
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      PORT: 5050
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5050:5050"
    command: ["node", "dist/server.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5050/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/helloaethonex-cmd/pureastra/backend}:${BACKEND_TAG:-main}
    container_name: pureastra_worker
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "dist/jobs/orders/inventory-reservation.worker.js"]
    restart: unless-stopped

volumes:
  redis_data:
