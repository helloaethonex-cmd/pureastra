services:
  redis:
    image: redis:7-alpine
    container_name: pureastra_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/helloaethonex-cmd/pureastra/backend}:${BACKEND_TAG:-main}
    container_name: pureastra_backend
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      PORT: 5050
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5050:5050"
    # Chromium needs at least 512MB of shared memory for stable PDF rendering.
    # Without this, /dev/shm fills up and Chromium crashes mid-render.
    shm_size: "1gb"
    command: ["node", "--require", "./dist/instrument.js", "dist/server.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5050/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/helloaethonex-cmd/pureastra/frontend}:${FRONTEND_TAG:-main}
    container_name: pureastra_frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Server-side rendering and middleware should use the Docker network.
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://backend:5050}
      # Client-side calls are baked into the image, but this keeps runtime
      # server code aligned with the value used during the image build.
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
      NEXT_PUBLIC_SHIPPING_GST_RATE: ${NEXT_PUBLIC_SHIPPING_GST_RATE:-}
      NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE: ${NEXT_PUBLIC_FLAT_SHIPPING_CHARGE_INCLUSIVE:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker-inventory:
    image: ${BACKEND_IMAGE:-ghcr.io/helloaethonex-cmd/pureastra/backend}:${BACKEND_TAG:-main}
    container_name: pureastra_worker_inventory
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "--require", "./dist/instrument.js", "dist/jobs/orders/inventory-reservation.worker.js"]
    restart: unless-stopped

  worker-email:
    image: ${BACKEND_IMAGE:-ghcr.io/helloaethonex-cmd/pureastra/backend}:${BACKEND_TAG:-main}
    container_name: pureastra_worker_email
    env_file:
      - ../apps/backend/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "--require", "./dist/instrument.js", "dist/jobs/email/email.worker.js"]
    restart: unless-stopped

volumes:
  redis_data:
